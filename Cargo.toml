[workspace]
resolver = "3"
members = ["crates/cargo-nuspec", "crates/nuspec", "crates/nuspec-test"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
authors = ["Sergey Vilgelm <sergey@vilgelm.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sv-tools/nuspec-rs"
keywords = ["nuspec", "nuget", "nupkg", "dotnet"]
categories = ["development-tools::build-utils"]
version = "0.3.0"

[workspace.dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
glob = "0.3.4"
nuspec = { path = "crates/nuspec", version = "0.3.0" }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
