name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    outputs:
      publish:
        value: ${{ jobs.RustMeta.outputs.publish }}
      # Set when called for a release tag (`<crate>/v<x.y.z>`), validated
      # against the crate's Cargo.toml version; empty otherwise.
      tag-package:
        value: ${{ jobs.RustMeta.outputs.tag-package }}
      tag-version:
        value: ${{ jobs.RustMeta.outputs.tag-version }}
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

env:
  CARGO_TERM_COLOR: always

# Every job here just clones the repo and runs cargo. Jobs that need more
# (`OsvScanner*` for SARIF upload) declare it per-job.
permissions:
  contents: read

jobs:
  RustMeta:
    name: Collect crate metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.rustmeta.outputs.matrix-include }}
      isolated-matrix: ${{ steps.isolated.outputs.matrix-include }}
      publish: ${{ steps.rustmeta.outputs.publish }}
      release-order: ${{ steps.rustmeta.outputs.release-order }}
      new-crates: ${{ steps.rustmeta.outputs.new-crates }}
      tag-package: ${{ steps.rustmeta.outputs.tag-package }}
      tag-version: ${{ steps.rustmeta.outputs.tag-version }}
      rust-version: ${{ steps.rustmeta.outputs.rust-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a release tag (when called from `release-stage.yaml`), this also
      # fails unless the tag names a publishable crate at its Cargo.toml version.
      - uses: sv-tools/rust-metadata-action@4020eda3b8b92b4cc9835dfe8d792ec2ace4690e # v1.3.1
        id: rustmeta
      # Each feature on its own, and no features at all, for `IsolatedBuildJob`.
      - uses: sv-tools/rust-metadata-action@4020eda3b8b92b4cc9835dfe8d792ec2ace4690e # v1.3.1
        id: isolated
        with:
          matrix-mode: isolated
  BuildJob:
    name: Build ${{ matrix.args }}
    needs: RustMeta
    strategy:
      matrix:
        include: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build ${{ matrix.args }} --all-targets --verbose
  IsolatedBuildJob:
    name: Build ${{ matrix.args }}
    needs: RustMeta
    # Builds each feature on its own, and no features at all, with warnings
    # denied, so code left behind a `cfg` (e.g. `nuspec` without `cargo`) is
    # not silently broken.
    strategy:
      matrix:
        include: ${{ fromJSON(needs.RustMeta.outputs.isolated-matrix) }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build ${{ matrix.args }} --all-targets --verbose
  MSRV:
    name: Check the minimum supported Rust version
    needs: RustMeta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ needs.RustMeta.outputs.rust-version }}
      - run: cargo check --workspace --all-features --all-targets --verbose
  Build:
    name: Wait for build jobs to finish
    needs: [BuildJob, IsolatedBuildJob, MSRV]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build jobs succeeded"
  Format:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo fmt --all --check --verbose
  Clippy:
    name: Check Rust code with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - run: cargo clippy --all-features --all-targets --verbose -- --deny warnings
      - run: cargo clippy --all-features --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
  Docs:
    name: Check rustdoc
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links, bare URLs and malformed HTML in doc comments
      # are warnings by default; docs.rs renders them wrong rather than
      # failing, so make them fatal here instead.
      RUSTDOCFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo doc --workspace --all-features --no-deps --verbose
  TestJob:
    name: Test ${{ matrix.args }}
    needs: RustMeta
    strategy:
      matrix:
        include: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Run tests
        run: cargo llvm-cov nextest ${{ matrix.args }} --all-targets --no-fail-fast --no-tests=pass --verbose
      # nextest does not execute doctests, so run them with the standard
      # test harness; only packages with a library target have any.
      - name: Run doctests
        if: ${{ matrix.lib }}
        run: cargo test --doc ${{ matrix.args }} --no-fail-fast --verbose
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      # Not sent to Codecov from here: each upload makes Codecov recompute its
      # statuses, so the `Coverage` job below sends all of them at once.
      - name: Store coverage and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-${{ strategy.job-index }}
          path: |
            coverage.lcov
            target/nextest/default/junit.xml
          retention-days: 1
  Coverage:
    name: Publish coverage to Codecov
    # Deliberately not part of `AllChecks`: the Codecov statuses are
    # informational.
    needs: [TestJob]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Codecov resolves the report paths against the repository tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: List the reports
        id: reports
        run: |
          set -euo pipefail
          mkdir -p coverage-reports
          list() { find coverage-reports -type f -name "$1" | sort | paste -sd, -; }
          echo "lcov=$(list coverage.lcov)" >> "$GITHUB_OUTPUT"
          echo "junit=$(list junit.xml)" >> "$GITHUB_OUTPUT"
          find coverage-reports -type f | sort
      - name: Upload coverage reports to Codecov
        if: ${{ steps.reports.outputs.lcov != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.reports.outputs.lcov }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ steps.reports.outputs.junit != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ${{ steps.reports.outputs.junit }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Tests:
    name: Wait for testing jobs to finish
    needs: [TestJob]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Testing jobs succeeded"
  Deps:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Machete
        run: cargo machete
      - name: Deny
        run: cargo deny check all
  OsvScannerPR:
    name: OSV Scanner (PR diff)
    # Diffs base branch deps vs PR head and annotates newly introduced
    # vulnerable deps. On every other event `OsvScanner` does a flat scan.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  OsvScanner:
    name: OSV Scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  PublishCrateJob:
    name: Test publishing bumped crates
    needs: RustMeta
    # `publish` is `'[]'` on commits that don't bump any crate version.
    if: ${{ needs.RustMeta.outputs.publish != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # All bumped crates go into one cargo invocation so cargo stages
      # siblings in a local registry; `publish` is already in dependency order.
      - name: Build the package flag list
        id: packages
        env:
          PUBLISH: ${{ needs.RustMeta.outputs.publish }}
        run: |
          set -euo pipefail
          flags="$(jq -j '.[] | "--package \(.) "' <<<"$PUBLISH")"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "batch: $flags"
      - name: Dry run publish
        run: cargo publish --all-features ${{ steps.packages.outputs.flags }} --dry-run --verbose
      - name: Report the release order
        env:
          RELEASE_ORDER: ${{ needs.RustMeta.outputs.release-order }}
          NEW_CRATES: ${{ needs.RustMeta.outputs.new-crates }}
        run: |
          set -euo pipefail
          {
            echo "### Release order"
            echo
            echo "One crate per tag; publish each release before pushing the next tag:"
            echo
            echo '```sh'
            jq -r '.[] | "git tag \(.) && git push origin \(.)"' <<<"$RELEASE_ORDER"
            echo '```'
            if [[ "$NEW_CRATES" != "[]" ]]; then
              echo
              echo "Not on crates.io yet, so trusted publishing can't create them; publish by hand first:"
              echo
              jq -r '.[] | "- `\(.)`"' <<<"$NEW_CRATES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create packages
        run: cargo package --all-features ${{ steps.packages.outputs.flags }} --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-crates
          path: target/package/*.crate
  NuGetJob:
    name: Pack and consume NuGet packages
    # End-to-end check of `cargo nuspec` on the `nuspec-test` crate: stage and pack both
    # packages, pack the staged `.nuspec` with `nuget` too, call the cdylib from a .NET app
    # that installs the native package, and run a binary unzipped from the app package.
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: sudo apt install mono-devel
        if: ${{ runner.os == 'Linux' }}
      - run: brew install mono
        if: ${{ runner.os == 'macOS' }}
      - uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
      - name: Stage and pack with cargo nuspec
        run: cargo run --package cargo-nuspec -- nuspec --package nuspec-test --release --stage --pack --out-dir dist
      - name: Pack the staged nuspec files with nuget
        shell: bash
        run: |
          set -euo pipefail
          for nuspec in dist/*/*.nuspec; do
            nuget pack "$nuspec" -OutputDirectory nuget-pack
          done
          ls -l nuget-pack
      - name: Call the native library from .NET
        shell: bash
        working-directory: crates/nuspec-test/dotnet
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nuspec-test") | .version')
          dotnet restore --source "$GITHUB_WORKSPACE/dist" -p:NuspecTestVersion="$version"
          output=$(dotnet run --no-restore -p:NuspecTestVersion="$version")
          echo "$output"
          grep -qF "Hello from Rust!" <<<"$output"
      - name: Run a binary from the app package
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls dist/nuspec-test.*.nupkg | grep -E 'nuspec-test\.[a-z]+-' )
          mkdir app
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Windows' own bsdtar reads zip archives; Git Bash's GNU tar does not.
            /c/Windows/System32/tar.exe -xf "$app" -C app
          else
            unzip -q "$app" -d app
          fi
          ls -l app/tools
          output=$(./app/tools/nuspec_test_bin_1)
          echo "$output"
          grep -qF "Hello, world!" <<<"$output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nuspec-test-${{ matrix.os }}-nuget
          path: |
            dist/*.nupkg
            nuget-pack/*.nupkg
  Publish:
    name: Wait for publishing jobs to finish
    needs:
      - RustMeta
      - PublishCrateJob
      - NuGetJob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.NuGetJob.result != 'success' || (needs.RustMeta.outputs.publish != '[]' && needs.PublishCrateJob.result != 'success') }}
        run: exit 1
  AllChecks:
    name: All checks
    needs:
      - Build
      - Format
      - Clippy
      - Docs
      - Tests
      - Deps
      - OsvScannerPR
      - OsvScanner
      - Publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Exactly one of `OsvScannerPR` / `OsvScanner` is skipped per event, so
      # a `skipped` result is expected here.
      - name: Verify all checks succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
