name: Release stage

# Tag-push half of the release flow: run full Checks and mint a *draft*
# GitHub Release. Nothing ships externally here — crates.io publishing lives
# in `publish.yaml` and fires when the draft is reviewed and published.

on:
  push:
    # Tags are `<crate>/v<x.y.z>`. GitHub tag filters are globs, not regexes.
    tags: [ "**/v[0-9]*.[0-9]*.[0-9]*" ]

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  Checks:
    # `OsvScanner` inside the reusable workflow needs `security-events: write`
    # for SARIF upload; reusable workflows can't escalate beyond the caller.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  DraftRelease:
    needs: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # Releases API
    steps:
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          # The repo will carry several crates with their own tags; don't let
          # any one release hijack the repo-wide "Latest" badge.
          make_latest: false

  # ────────────────────────────────────────────────────────────────────────
  # cargo-nuspec binaries, only for `cargo-nuspec/v…` tags: build every
  # target, sign each archive with Sigstore (keyless cosign), record SLSA
  # build provenance, and attach archives, checksums and signature bundles
  # to the draft release. `publish.yaml` points the Homebrew formula at them
  # once the draft is published; `cargo binstall` finds them through
  # `[package.metadata.binstall]`.
  # ────────────────────────────────────────────────────────────────────────
  Binaries:
    needs: Checks
    # `tag-package` comes from the tag, validated against Cargo.toml by Checks.
    if: ${{ needs.Checks.outputs.tag-package == 'cargo-nuspec' }}
    uses: ./.github/workflows/binaries.yaml

  AttachBinaries:
    needs:
      - Checks
      - DraftRelease
      - Binaries
    if: ${{ needs.Checks.outputs.tag-package == 'cargo-nuspec' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload assets to the draft release
      id-token: write     # OIDC token for keyless cosign signing and the attestation
      attestations: write # actions/attest writes to GitHub's attestation store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: cargo-nuspec-*
          merge-multiple: true

      - name: Check archives match the tag
        env:
          V: ${{ needs.Checks.outputs.tag-version }}
        run: |
          set -euo pipefail
          ls -l artifacts
          count=$(ls artifacts/cargo-nuspec-"${V}"-*.{tar.gz,zip} 2>/dev/null | wc -l)
          if [[ "$count" -ne 6 ]]; then
            echo "::error::expected 6 archives for ${V}, found ${count}"
            exit 1
          fi
          cd artifacts && shasum -a 256 -c ./*.sha256

      # ── Sigstore keyless signing ─────────────────────────────────────────
      # cosign exchanges the workflow's OIDC token for a short-lived Fulcio
      # certificate, signs each archive and records it in the public Rekor
      # transparency log. `<archive>.bundle` holds the signature, the
      # certificate with the workflow identity and the inclusion proof:
      #   cosign verify-blob --bundle <archive>.bundle \
      #     --certificate-identity-regexp '^https://github.com/sv-tools/nuspec-rs/\.github/workflows/release-stage\.yaml@refs/tags/cargo-nuspec/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     <archive>
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.0.6"
      - name: Sign archives with cosign (keyless)
        env:
          V: ${{ needs.Checks.outputs.tag-version }}
        run: |
          set -euo pipefail
          for archive in artifacts/cargo-nuspec-"${V}"-*.{tar.gz,zip}; do
            cosign sign-blob --yes --bundle "${archive}.bundle" "$archive"
          done

      # ── SLSA build provenance ────────────────────────────────────────────
      # Stored in GitHub's attestation store, not on the release:
      #   gh attestation verify <archive> --repo sv-tools/nuspec-rs
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/cargo-nuspec-${{ needs.Checks.outputs.tag-version }}-*.tar.gz
            artifacts/cargo-nuspec-${{ needs.Checks.outputs.tag-version }}-*.zip

      - name: Attach binaries to the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/cargo-nuspec-${{ needs.Checks.outputs.tag-version }}-*
          draft: true
          make_latest: false
