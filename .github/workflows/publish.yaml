name: Publish

# External-distribution half of the release flow: `cargo publish` to
# crates.io. Fires when a draft GitHub Release minted by `release-stage.yaml`
# is published. `workflow_dispatch` allows retrying without re-tagging.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. nuspec/v0.3.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  Resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != */v* ]]; then
            echo "::error::tag '$TAG' must be in the form <package>/v<version>"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "package=${TAG%/v*}"
            echo "version=${TAG##*/v}"
          } >> "$GITHUB_OUTPUT"

  Publish:
    needs: Resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by `crates-io-auth-action` to exchange the OIDC token for a
      # short-lived crates.io publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.Resolve.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # One crate per tag: when a release spans several crates, push the tags
      # in dependency order (see the `Release order` summary in checks).
      - run: cargo publish --all-features --package ${{ needs.Resolve.outputs.package }} --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
