name: Publish

# External-distribution half of the release flow: `cargo publish` to
# crates.io. Fires when a draft GitHub Release minted by `release-stage.yaml`
# is published. `workflow_dispatch` allows retrying without re-tagging.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. nuspec/v0.3.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  Resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != */v* ]]; then
            echo "::error::tag '$TAG' must be in the form <package>/v<version>"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "package=${TAG%/v*}"
            echo "version=${TAG##*/v}"
          } >> "$GITHUB_OUTPUT"

  Publish:
    needs: Resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by `crates-io-auth-action` to exchange the OIDC token for a
      # short-lived crates.io publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.Resolve.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # One crate per tag: when a release spans several crates, push the tags
      # in dependency order (see the `Release order` summary in checks).
      - run: cargo publish --all-features --package ${{ needs.Resolve.outputs.package }} --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ────────────────────────────────────────────────────────────────────────
  # Homebrew formula for cargo-nuspec in the sv-tools/homebrew-apps tap,
  # pointing at the archives `release-stage.yaml` attached to the release.
  # Idempotent: re-running for the same version is a no-op.
  # ────────────────────────────────────────────────────────────────────────
  Homebrew:
    needs:
      - Resolve
      - Publish
    if: ${{ needs.Resolve.outputs.package == 'cargo-nuspec' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.Resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir artifacts --pattern 'cargo-nuspec-*.tar.gz.sha256'
          ls artifacts

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sv-tools/homebrew-apps
          # Fine-grained PAT with Contents: read and write on
          # sv-tools/homebrew-apps; GITHUB_TOKEN is scoped to this repository.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-apps

      - name: Render and commit the formula
        working-directory: homebrew-apps
        env:
          VERSION: ${{ needs.Resolve.outputs.version }}
          TAG: ${{ needs.Resolve.outputs.tag }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sha() {
            awk '{print $1}' "../artifacts/cargo-nuspec-${VERSION}-$1.tar.gz.sha256"
          }
          asset() {
            printf '      url "%s"\n      sha256 "%s"' \
              "${REPO_URL}/releases/download/${TAG}/cargo-nuspec-${VERSION}-$1.tar.gz" "$(sha "$1")"
          }
          mkdir -p Formula
          cat > Formula/cargo-nuspec.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true
          #
          # Generated by sv-tools/nuspec-rs .github/workflows/publish.yaml.
          # Do not edit by hand: changes are overwritten on the next release.
          class CargoNuspec < Formula
            desc "Cargo subcommand that builds a crate and packages it as NuGet packages"
            homepage "${REPO_URL}"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
          $(asset aarch64-apple-darwin)
              end
              on_intel do
          $(asset x86_64-apple-darwin)
              end
            end

            on_linux do
              on_arm do
          $(asset aarch64-unknown-linux-musl)
              end
              on_intel do
          $(asset x86_64-unknown-linux-musl)
              end
            end

            def install
              bin.install "cargo-nuspec"
            end

            def caveats
              <<~EOS
                cargo-nuspec runs \`cargo build\`, so it needs a Rust toolchain,
                for example from rustup. Run it as \`cargo nuspec\`.
              EOS
            end

            test do
              assert_match "cargo-nuspec #{version}", shell_output("#{bin}/cargo-nuspec nuspec --version")
            end
          end
          FORMULA
          cat Formula/cargo-nuspec.rb
          ruby -c Formula/cargo-nuspec.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cargo-nuspec.rb
          if git diff --cached --quiet; then
            echo "cargo-nuspec formula unchanged at ${VERSION}"
          else
            git commit -m "cargo-nuspec ${VERSION}"
            git push
          fi
