[package]
name = "cargo-nuspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Cargo subcommand that builds a crate and packages it as NuGet packages (.nuspec / .nupkg)"
readme.workspace = true
repository.workspace = true
keywords = ["nuget", "nupkg", "nuspec", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]

[dependencies]
anyhow.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
nuspec = { workspace = true, features = ["cargo"] }

[dev-dependencies]
serde_json.workspace = true
zip.workspace = true

[lints]
workspace = true

# Prebuilt archives attached to the `cargo-nuspec/v<version>` GitHub releases by
# `.github/workflows/release-stage.yaml`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cargo-nuspec/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
