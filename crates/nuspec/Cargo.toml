[package]
name = "nuspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Implementation of Nuspec Specification"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Real-world .nuspec files used by the tests; not needed by users of the crate.
exclude = ["tests/fixtures"]

[features]
# Builds `Package`s from `cargo metadata` and `cargo build --message-format=json` output.
cargo = ["dep:cargo_metadata", "dep:glob", "dep:serde_json", "dep:zip"]

[dependencies]
cargo_metadata = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
quick-xml.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[lints]
workspace = true
