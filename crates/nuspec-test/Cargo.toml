[package]
name = "nuspec-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A test crate for nuspec"
publish = false

[[bin]]
name = "nuspec_test_bin_1"
path = "src/main.rs"

[[bin]]
name = "nuspec_test_bin_2"
path = "src/bin2.rs"

[lib]
name = "nuspec_test_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

# Packaged by `cargo nuspec`: the cdylib becomes a native package and the binaries an app
# package, with the license files added to both.
[package.metadata.nuspec]
files = [
  { src = "../../LICENSE-MIT", target = "" },
  { src = "../../LICENSE-APACHE", target = "" },
]

[package.metadata.nuspec.metadata]
requireLicenseAcceptance = false

[lints]
workspace = true
